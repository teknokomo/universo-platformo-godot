# API Routes Specification for Universo Platformo Godot
# Feature: 001-project-setup
# Date: 2025-11-17
# Format: OpenAPI 3.0

openapi: 3.0.0
info:
  title: Universo Platformo Godot API
  version: 0.1.0
  description: REST API for Universo Platformo Godot full-stack platform
  contact:
    name: Universo Platformo Team
    url: https://github.com/teknokomo/universo-platformo-godot

servers:
  - url: http://localhost:8080/api
    description: Local development server
  - url: https://api.universoplataformo.com
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error code (e.g., ERROR_AUTH_INVALID_TOKEN)
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context
    
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        created_at:
          type: number
          description: Unix timestamp
        updated_at:
          type: number
          description: Unix timestamp
        is_active:
          type: boolean
    
    Cluster:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 500
        owner_id:
          type: string
          format: uuid
        created_at:
          type: number
        updated_at:
          type: number
        is_public:
          type: boolean
        metadata:
          type: object
    
    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 500
        cluster_id:
          type: string
          format: uuid
        created_at:
          type: number
        updated_at:
          type: number
        configuration:
          type: object
        order_index:
          type: integer
    
    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 500
        domain_id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum: [file, link, data, note]
        data:
          type: object
        created_at:
          type: number
        updated_at:
          type: number
        file_url:
          type: string
          format: uri
        file_size:
          type: integer

paths:
  # ===================================================================
  # AUTHENTICATION ENDPOINTS
  # ===================================================================
  
  /auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: number
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/login:
    post:
      summary: Login with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: number
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: number
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/logout:
    post:
      summary: Logout user
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  # ===================================================================
  # CLUSTERS ENDPOINTS
  # ===================================================================
  
  /clusters:
    get:
      summary: List clusters
      tags: [Clusters]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: owner_id
          in: query
          description: Filter by owner (current user if not specified)
          schema:
            type: string
            format: uuid
        - name: is_public
          in: query
          description: Filter public/private clusters
          schema:
            type: boolean
      responses:
        '200':
          description: List of clusters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cluster'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
    
    post:
      summary: Create cluster
      tags: [Clusters]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                is_public:
                  type: boolean
                metadata:
                  type: object
      responses:
        '201':
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /clusters/{cluster_id}:
    get:
      summary: Get cluster by ID
      tags: [Clusters]
      security:
        - BearerAuth: []
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Update cluster
      tags: [Clusters]
      security:
        - BearerAuth: []
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                is_public:
                  type: boolean
                metadata:
                  type: object
      responses:
        '200':
          description: Cluster updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '404':
          description: Cluster not found
        '403':
          description: Unauthorized (not owner)
    
    delete:
      summary: Delete cluster
      tags: [Clusters]
      security:
        - BearerAuth: []
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cluster deleted
        '404':
          description: Cluster not found
        '403':
          description: Unauthorized (not owner)
  
  # ===================================================================
  # DOMAINS ENDPOINTS
  # ===================================================================
  
  /clusters/{cluster_id}/domains:
    get:
      summary: List domains in cluster
      tags: [Domains]
      security:
        - BearerAuth: []
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
    
    post:
      summary: Create domain in cluster
      tags: [Domains]
      security:
        - BearerAuth: []
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                configuration:
                  type: object
                order_index:
                  type: integer
      responses:
        '201':
          description: Domain created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
  
  /domains/{domain_id}:
    get:
      summary: Get domain by ID
      tags: [Domains]
      security:
        - BearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Domain details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
    
    put:
      summary: Update domain
      tags: [Domains]
      security:
        - BearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                configuration:
                  type: object
                order_index:
                  type: integer
      responses:
        '200':
          description: Domain updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
    
    delete:
      summary: Delete domain
      tags: [Domains]
      security:
        - BearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Domain deleted
  
  # ===================================================================
  # RESOURCES ENDPOINTS
  # ===================================================================
  
  /domains/{domain_id}/resources:
    get:
      summary: List resources in domain
      tags: [Resources]
      security:
        - BearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resource_type
          in: query
          description: Filter by resource type
          schema:
            type: string
            enum: [file, link, data, note]
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
    
    post:
      summary: Create resource in domain
      tags: [Resources]
      security:
        - BearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, resource_type]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                resource_type:
                  type: string
                  enum: [file, link, data, note]
                data:
                  type: object
                file_url:
                  type: string
                file_size:
                  type: integer
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
  
  /resources/{resource_id}:
    get:
      summary: Get resource by ID
      tags: [Resources]
      security:
        - BearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
    
    put:
      summary: Update resource
      tags: [Resources]
      security:
        - BearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                resource_type:
                  type: string
                data:
                  type: object
                file_url:
                  type: string
                file_size:
                  type: integer
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
    
    delete:
      summary: Delete resource
      tags: [Resources]
      security:
        - BearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Resource deleted
